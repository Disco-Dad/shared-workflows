name: Node check

# Checks one TypeScript/Astro app under apps/<app>/ by running the caller's own
# justfile: `just install <app>` (pnpm install --frozen-lockfile) then
# `just check <app>`. Node comes from the app's .node-version and pnpm from the
# packageManager field of its package.json.
on:
  workflow_call:
    inputs:
      app:
        description: App folder name under apps/.
        type: string
        required: true
      working-directory:
        description: Folder holding the justfile and apps/ (default the repository root).
        type: string
        default: "."
      just-version:
        type: string
        default: "1.59.0"

permissions:
  contents: read

jobs:
  check:
    name: check (${{ inputs.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory }}/apps/${{ inputs.app }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.working-directory }}/apps/${{ inputs.app }}/.node-version
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/apps/${{ inputs.app }}/pnpm-lock.yaml
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ inputs.just-version }}
      - run: just install "$APP"
      - run: just check "$APP"
